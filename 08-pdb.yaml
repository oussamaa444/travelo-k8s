apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: travelo-frontend
  namespace: travelo
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: travelo-frontend
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: travelo-backend
  namespace: travelo
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: travelo-backend
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: travelo-database
  namespace: travelo
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: travelo-database