apiVersion: v1
kind: Pod
metadata:
  name: probe-demo
  namespace: travelo
  labels:
    app: probe-demo
spec:
  containers:
  - name: demo
    image: oussama444/travelo-frontend:1.3
    imagePullPolicy: IfNotPresent
    ports:
    - containerPort: 3000
    startupProbe:
      tcpSocket:
        port: 9999
      periodSeconds: 5
      failureThreshold: 3